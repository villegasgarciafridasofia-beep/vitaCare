name: proyectovita
description: "VitaCare AI"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Notificaciones
  flutter_local_notifications: ^19.0.0
  android_alarm_manager_plus: ^4.0.0
  timezone: ^0.10.0
  flutter_timezone: ^5.1.0

  # Google
  google_sign_in: ^6.2.1

  # Estado
  provider: ^6.1.5

  # Almacenamiento
  shared_preferences: ^2.5.3

  # Utilidades
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  speech_to_text: ^7.4.0
  image_picker: ^1.2.2
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

